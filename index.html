<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --link: var(--tg-theme-link-color, #2678b6);
            --btn: var(--tg-theme-button-color, #2678b6);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 12px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--hint);
            margin-bottom: 16px;
        }
        .header h1 { font-size: 20px; margin-bottom: 4px; }
        .header p  { font-size: 14px; color: var(--hint); }

        /* ─── Tabs ─── */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 6px;
            border: none;
            border-radius: 8px;
            background: var(--secondary-bg);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .tab-btn.active {
            background: var(--btn);
            color: var(--btn-text);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ─── Stats cards ─── */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--secondary-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: var(--link);
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--hint);
            margin-top: 4px;
        }

        /* ─── Lists ─── */
        .entry-list { list-style: none; }

        .entry-item {
            background: var(--secondary-bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            position: relative;
        }
        .entry-item .date {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .entry-item .details {
            font-size: 13px;
            color: var(--hint);
            line-height: 1.5;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .delete-btn:active {
            opacity: 0.7;
        }

        .load-more {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--secondary-bg);
            color: var(--link);
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }
        .load-more:active {
            opacity: 0.7;
        }

        .empty {
            text-align: center;
            color: var(--hint);
            padding: 32px 0;
            font-size: 14px;
        }

        .spinner {
            text-align: center;
            padding: 24px;
            color: var(--hint);
        }

        /* ─── Time entry ─── */
        .time-hours {
            display: inline-block;
            background: var(--btn);
            color: var(--btn-text);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .time-photos {
            display: inline-block;
            background: #27ae60;
            color: #fff;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 13px;
            font-weight: 600;
            margin-left: 4px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="user-name">Загрузка…</h1>
    <p id="user-phone"></p>
</div>

<div class="tabs">
    <button class="tab-btn active" data-tab="stats">📊 Стат</button>
    <button class="tab-btn" data-tab="time">⏱ Время</button>
    <button class="tab-btn" data-tab="logs">📋 Логи</button>
    <button class="tab-btn" data-tab="users">👥 Люди</button>
</div>

<!-- Stats -->
<div id="tab-stats" class="tab-content active">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="value" id="s-logs">—</div>
            <div class="label">Записей</div>
        </div>
        <div class="stat-card">
            <div class="value" id="s-photos">—</div>
            <div class="label">Снимков</div>
        </div>
        <div class="stat-card">
            <div class="value" id="s-days">—</div>
            <div class="label">Рабочих дней</div>
        </div>
        <div class="stat-card">
            <div class="value" id="s-hours">—</div>
            <div class="label">Часов</div>
        </div>
    </div>
</div>

<!-- Time -->
<div id="tab-time" class="tab-content">
    <ul class="entry-list" id="time-list"></ul>
    <button class="load-more" id="time-more" style="display:none;">Загрузить ещё</button>
    <div class="spinner" id="time-spinner">Загрузка…</div>
</div>

<!-- Logs -->
<div id="tab-logs" class="tab-content">
    <ul class="entry-list" id="logs-list"></ul>
    <button class="load-more" id="logs-more" style="display:none;">Загрузить ещё</button>
    <div class="spinner" id="logs-spinner">Загрузка…</div>
</div>

<!-- Users -->
<div id="tab-users" class="tab-content">
    <ul class="entry-list" id="users-list"></ul>
    <button class="load-more" id="users-more" style="display:none;">Загрузить ещё</button>
    <div class="spinner" id="users-spinner">Загрузка…</div>
</div>

<script>
// ─── Config ──────────────────────────────────────────
const API_BASE = 'https://coffee-expansion-tower-poet.trycloudflare.com';

const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const initData = tg.initData;

const headers = {
    'Content-Type': 'application/json',
    'X-Init-Data': initData,
};

// ─── Tabs ────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');

        if (btn.dataset.tab === 'logs' && !logsLoaded) loadLogs();
        if (btn.dataset.tab === 'time' && !timeLoaded) loadTime();
        if (btn.dataset.tab === 'users' && !usersLoaded) loadUsers();
    });
});

// ─── API helpers ─────────────────────────────────────
async function api(path, opts = {}) {
    const resp = await fetch(API_BASE + path, { headers, ...opts });
    if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.detail || resp.statusText);
    }
    return resp.json();
}

// ─── User info ───────────────────────────────────────
async function loadMe() {
    try {
        const u = await api('/api/me');
        document.getElementById('user-name').textContent =
            u.first_name + ' ' + u.last_name;
        document.getElementById('user-phone').textContent = u.phone_number;
    } catch (e) {
        document.getElementById('user-name').textContent = 'Не зарегистрирован';
    }
}

// ─── Stats ───────────────────────────────────────────
async function loadStats() {
    try {
        const s = await api('/api/stats');
        document.getElementById('s-logs').textContent = s.total_logs;
        document.getElementById('s-photos').textContent = s.total_photos;
        document.getElementById('s-days').textContent = s.total_days;
        document.getElementById('s-hours').textContent = s.total_hours;
    } catch (e) {
        console.error('Stats error', e);
    }
}

// ─── Time ────────────────────────────────────────────
let timeLoaded = false;
let timeOffset = 0;
const LIMIT = 30;

async function loadTime(more = false) {
    if (!more) timeOffset = 0;
    try {
        const items = await api(`/api/time?limit=${LIMIT}&offset=${timeOffset}`);
        const list = document.getElementById('time-list');
        if (!more) list.innerHTML = '';

        if (items.length === 0 && !more) {
            list.innerHTML = '<li class="empty">Нет данных о времени</li>';
        }

        items.forEach(e => {
            const li = document.createElement('li');
            li.className = 'entry-item';
            li.innerHTML = `
                <div class="date">${e.date}</div>
                <div class="details">
                    <span class="time-hours">⏱ ${e.hours} ч</span>
                    ${e.photos > 0 ? `<span class="time-photos">📷 ${e.photos}</span>` : ''}
                </div>
            `;
            list.appendChild(li);
        });

        document.getElementById('time-more').style.display =
            items.length === LIMIT ? 'block' : 'none';
        timeOffset += items.length;
        timeLoaded = true;
    } catch (e) {
        console.error('Time error', e);
    }
    document.getElementById('time-spinner').style.display = 'none';
}

document.getElementById('time-more').addEventListener('click', () => loadTime(true));

// ─── Logs ────────────────────────────────────────────
let logsLoaded = false;
let logsOffset = 0;

async function loadLogs(more = false) {
    if (!more) logsOffset = 0;
    try {
        const items = await api(`/api/logs?limit=${LIMIT}&offset=${logsOffset}`);
        const list = document.getElementById('logs-list');
        if (!more) list.innerHTML = '';

        if (items.length === 0 && !more) {
            list.innerHTML = '<li class="empty">Нет записей</li>';
        }

        items.forEach(e => {
            const li = document.createElement('li');
            li.className = 'entry-item';
            li.innerHTML = `
                <div class="date">${e.date}</div>
                <div class="details">
                    📍 ${e.address}<br>
                    📷 Снимков: ${e.photo_count}
                    ${e.comment ? '<br>💬 ' + e.comment : ''}
                </div>
                <button class="delete-btn" onclick="deleteLog(${e.id}, this)">✕</button>
            `;
            list.appendChild(li);
        });

        document.getElementById('logs-more').style.display =
            items.length === LIMIT ? 'block' : 'none';
        logsOffset += items.length;
        logsLoaded = true;
    } catch (e) {
        console.error('Logs error', e);
    }
    document.getElementById('logs-spinner').style.display = 'none';
}
